name: CI - WdioMobile Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Ejecución diaria 06:00 UTC (01:00 hora Colombia) — alimenta el histórico del dashboard
    - cron: "0 6 * * *"

# Evita corridas simultáneas del mismo repo (push + cron pueden solaparse);
# la publicación al dashboard usa su propio bucle de reintento para la
# carrera entre repos distintos.
concurrency:
  group: ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mobile-tests:
    name: Mobile Tests (Android emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download demo app APK
        run: |
          mkdir -p apps
          curl -L --fail --retry 3 -o apps/android.wdio.native.app.v2.2.0.apk \
            https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk
          ls -lh apps/

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Appium server
        run: |
          npm install -g appium@3.9.0
          appium driver install uiautomator2
          nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
          # esperar a que el servidor esté listo
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4723/status | grep -q '"ready":true'; then
              echo "Appium listo"
              break
            fi
            sleep 2
          done
          # fallar el paso si el servidor nunca quedó listo
          curl -s http://127.0.0.1:4723/status | grep -q '"ready":true'

      - name: Run mobile tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Paso principal: solo escenarios estables (deben pasar sí o sí).
          # NavigationTest y SwipeTest se ejecutan en un paso aparte como
          # "fallas conocidas" (ver paso siguiente).
          # Nota: -Dsurefire.reportDirectory no funciona en Surefire 3.1.2
          # (verificado empíricamente: los XML siempre van a
          # target/surefire-reports). Se usa el directorio por defecto y se
          # renombra con mv en el paso siguiente.
          script: mvn clean test -B "-Dtest=LoginTest,SignupTest"

      - name: Preserve main reports
        if: always()
        run: mv target/surefire-reports target/surefire-reports-main

      - name: Run known-failure scenarios (Navigation, Swipe)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Escenarios intermitentes bajo renderizado por software
          # (SwiftShader): WebView no renderiza (Navigation) y gestos de
          # swipe no siempre se procesan (Swipe). Limitación conocida del
          # entorno de CI, documentada en el README. Se ejecutan con
          # maven.test.failure.ignore=true para que la falla quede
          # registrada en los reportes Surefire/Allure como evidencia
          # documentada, sin romper el pipeline.
          script: mvn test -B "-Dtest=NavigationTest,SwipeTest" "-Dmaven.test.failure.ignore=true"

      - name: Preserve known-failure reports
        if: always()
        run: mv target/surefire-reports target/surefire-reports-known

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-mobile
          path: |
            target/surefire-reports-main/
            target/surefire-reports-known/
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile
          path: target/allure-results/
          retention-days: 7

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          retention-days: 7

      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate target/allure-results -o allure-report --clean

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-mobile
          path: allure-report/
          retention-days: 7

      - name: Publish results to dashboard
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "DASHBOARD_TOKEN no configurado — se omite la publicación (configure el secreto para activar el flujo automático)."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${DASHBOARD_TOKEN}@github.com/AngelicaJuliethSP/Proyecto-grado-dashboard.git" dashboard-repo
          EXEC_AT="${{ github.event.head_commit.timestamp }}"
          if [ -z "$EXEC_AT" ]; then
            EXEC_AT=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")
          fi
          cd dashboard-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Un solo registro por corrida: se combinan los reportes del paso
          # principal (Login/Signup) y de fallas conocidas (Navigation/Swipe)
          # en un solo directorio; el parser los fusiona en un único registro
          # con cada test en su estado real (los fallos quedan marcados como
          # failed en el detalle, no ocultos). Publicar 2 registros separados
          # (uno 100% y otro ~0%) distorsionaba la tendencia y los KPIs.
          COMBINED=../target/surefire-reports-combined
          mkdir -p "$COMBINED"
          # Prefijo distinto por paso: Surefire+TestNG nombra TEST-TestSuite.xml
          # en ambos pasos, y un cp sin prefijo hace que el segundo sobrescriba
          # al primero (se perdian Login/Signup del registro combinado).
          for f in ../target/surefire-reports-main/TEST-*.xml;  do cp "$f" "$COMBINED/TEST-main-${f##*/TEST-}";  done
          for f in ../target/surefire-reports-known/TEST-*.xml; do cp "$f" "$COMBINED/TEST-known-${f##*/TEST-}"; done
          # Los 3 repos publican al mismo almacén y pueden llegar a la vez:
          # si el push es rechazado (non-fast-forward), se toma el histórico
          # remoto actualizado, se regenera el registro sobre él (el parser
          # deduplica por proyecto+executed_at) y se reintenta.
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 parser/results_parser.py \
              --project WdioMobileAutomation \
              --reports-dir "$COMBINED" \
              --output data/results.json \
              --executed-at "$EXEC_AT"
            git add data/results.json
            if git diff --cached --quiet; then
              echo "Sin cambios en el histórico — nada que publicar."
              exit 0
            fi
            git commit -m "ci: resultados automaticos de WdioMobileAutomation (run ${{ github.run_id }})"
            if git push origin main; then
              echo "Resultados publicados en el dashboard."
              exit 0
            fi
            echo "Push rechazado (intento $intento/5) — reintentando con el histórico remoto."
            sleep $((RANDOM % 10 + 5))
          done
          echo "No se pudo publicar tras 5 intentos."
          exit 1
